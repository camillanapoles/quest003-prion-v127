<style>
  :root{
    --bg:#0b1020; --panel:#111832; --panel2:#0e142a; --ink:#e5eaf5; --mut:#8b96b3;
    --confirmed:#22c55e; --constraint:#f59e0b; --refuted:#ef4444; --proposed:#3b82f6; --active:#a78bfa;
    --line:#26304f; --focus:#7cc4ff; --focal:#ff8a5c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;padding:14px 20px 10px;border-bottom:1px solid var(--line)}
  header h1{font-size:17px;font-weight:650;letter-spacing:.2px}
  header .sub{color:var(--mut);font-size:12px}
  header .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mut)}
  .pill{padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:11px}
  .msg{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;padding:10px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(255,138,92,.07),transparent 70%)}
  .msg .tag{font-size:10px;letter-spacing:1.4px;color:var(--focal);text-transform:uppercase;white-space:nowrap}
  .msg .txt{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:14.5px;color:#ffd9c7}
  #viewbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);align-items:center}
  .vbtn{display:inline-flex;gap:6px;align-items:center;padding:9px 14px;min-height:40px;border-radius:10px;border:1px solid var(--line);cursor:pointer;font-size:12.5px;user-select:none;background:transparent;color:var(--ink)}
  .vbtn.on{background:#1a2342;border-color:var(--focus)}
  .vbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .vdesc{color:var(--mut);font-size:12px;margin-left:auto}
  #scroller{overflow:auto;max-height:calc(100vh - 220px)}
  .legend{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);align-items:center}
  .chip{display:inline-flex;gap:6px;align-items:center;padding:8px 14px;min-height:40px;border-radius:10px;border:1px solid var(--line);cursor:pointer;font-size:12.5px;user-select:none;background:transparent;color:var(--ink)}
  .chip .dot{width:10px;height:10px;border-radius:50%}
  .chip.on{background:#1a2342}
  .chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .stats{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--mut)}
  .stats b{color:var(--ink)}
  svg{display:block;margin:0 auto}
  svg text{font-family:inherit}
  .node rect.box{cursor:pointer;stroke-width:1.4}
  .node text.lbl{font-size:11.5px;fill:var(--ink);pointer-events:none}
  .node text.ico{font-size:12px;pointer-events:none}
  .node:focus-visible{outline:none}
  .node:focus-visible .box{stroke:#fff;stroke-width:2.4}
  .node.focal .box{stroke:var(--focal);stroke-width:2.4;filter:drop-shadow(0 0 7px rgba(255,138,92,.45))}
  .node text.focaltag{font-size:9.5px;fill:var(--focal);letter-spacing:1.2px;pointer-events:none}
  .cluster-label{font-size:11px;letter-spacing:1.6px;fill:var(--mut);text-transform:uppercase;pointer-events:none}
  .dimmed{opacity:.13}
  #veil{position:fixed;inset:0;background:rgba(4,8,18,.55);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40}
  #veil.on{opacity:1;pointer-events:auto}
  #panel{position:fixed;top:0;right:0;height:100dvh;width:min(380px,94vw);background:var(--panel2);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.45);transform:translateX(105%);transition:transform .25s ease;z-index:50;display:flex;flex-direction:column;padding:0}
  #panel.open{transform:none}
  #panel .head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0}
  #panel .head h2{font-size:14.5px;flex:1;padding-top:10px}
  #closeBtn{flex:none;width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
  #closeBtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  #panel .body{padding:14px 16px 24px;overflow-y:auto}
  .panel .kv{font-size:12.5px;color:var(--mut);margin:4px 0}
  .panel .detail{font-size:13px;margin:12px 0;color:#c9d2e8}
  .panel .refs{font-size:11px;color:var(--mut);word-break:break-all}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;margin:2px 4px 2px 0}
  section.block{padding:14px 20px;border-bottom:1px solid var(--line)}
  section.block h3{font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
  .gates{display:flex;flex-wrap:wrap;gap:10px}
  .gate{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:200px;flex:1;background:var(--panel)}
  .gate b{font-size:13px}
  .gate .st{font-size:11px;margin:4px 0;display:block}
  .gate .dt{font-size:11px;color:var(--mut)}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:11px}
  tr.rowbtn{cursor:pointer}
  tr.rowbtn:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
  .probrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .probrow .name{width:280px;font-size:12.5px}
  .probbar{position:relative;height:18px;background:#1a2240;border-radius:6px;flex:1;overflow:hidden}
  .probbar .seg{position:absolute;top:0;bottom:0;border-radius:6px}
  .probbar .cap{position:absolute;top:0;height:100%;border-left:2px solid #fff6}
  .probrow .dir{font-size:15px;width:22px;text-align:center}
  .chg{margin-bottom:10px}
  .chg .d{font-size:11px;color:var(--mut)}
  .chg .v{color:#7cc4ff;font-size:11px;margin-left:6px}
  .chg p{font-size:12.5px;color:#c9d2e8;margin-top:2px}
  #err{display:none;padding:12px 20px;background:#3a1620;color:#fca5a5;font-size:13px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<header>
  <div>
    <h1 id="title">—</h1>
    <div class="sub" id="subtitle"></div>
  </div>

</header>
<div class="msg" id="msg"><span class="tag">📌 mensagem-chefe</span><span class="txt" id="msgtxt"></span></div>

<section class="block"><h3>Portões do programa (gates de falsificabilidade)</h3><div class="gates" id="gates"></div></section>
<section class="block"><h3>Evolução das probabilidades (por sessão)</h3><div id="probs"></div></section>

<script>
'use strict';
/* ============================================================
   LAYOUT ENGINE v1.4 — regras §6 diagram-design:
   · cluster = container com FILEIRA ÚNICA de nós (nunca paralelos)
   · conectores ortogonais, cantos quarter-arc r=8, sem diagonais
   · attach points em leque (≥14px entre pontos na mesma borda)
   · transit nunca atrás de nó: skip/backward → corredores laterais
   · barycenter p/ reduzir cruzamentos; densidade por vista
   ============================================================ */
const GROUPS=[
 {id:'molecular',label:'① Fundamento molecular — o escudo V127'},
 {id:'classe',label:'② Classe terapêutica — negação de substrato'},
 {id:'celular',label:'③ Modelo celular — o que a célula pode e não pode'},
 {id:'entrega',label:'④ Entrega cirúrgica — CED e contenção'},
 {id:'traducao',label:'⑤ Tradução — população, regulatório, programa'}
];
const STATUS={
 confirmed:{c:'var(--confirmed)',i:'✓',t:'CONFIRMADO',n:'confirmado por literatura'},
 constraint:{c:'var(--constraint)',i:'⚠',t:'RESTRIÇÃO',n:'válido com condição/constraint'},
 refuted:{c:'var(--refuted)',i:'✕',t:'REFUTADO',n:'refutado — corrigido/ajustado'},
 proposed:{c:'var(--proposed)',i:'⏳',t:'PROPOSTO',n:'proposto — aguarda teste'},
 active:{c:'var(--active)',i:'▶',t:'ATIVO',n:'em curso / desenho ativo'}
};
const EDGES={supports:{c:'#15803d',d:'sustenta'},constrains:{c:'#b45309',d:'limita/exige'},refutes:{c:'#b91c1c',d:'refuta'},enables:{c:'#1d4ed8',d:'habilita'},tests:{c:'#7c3aed',d:'testado por'}};

const NW=212,NH=86,NGAP=16;      // cartão e vão horizontal
const PADX=18,LABELH=34,PADY=12; // container do cluster
const BAND_GAP=78;               // corredor vertical entre clusters
const LANE=92;                   // corredores laterais p/ arestas skip/backward
const R=8;                       // raio dos cantos ortogonais (regra §6.1)

let D=null,VIEW='pesquisador';

function wrap(t,n){const w=t.split(' ');const L=[];let cur='';
  for(const x of w){if((cur+' '+x).trim().length<=n){cur=(cur+' '+x).trim()}else{L.push(cur);cur=x;if(L.length>=3)break}}
  if(cur&&L.length<3)L.push(cur);
  if(t.length>110&&L[2])L[2]=L[2]+'…';
  return L.slice(0,3)}

function visible(){
  const v=(D.meta.views||[]).find(x=>x.id===VIEW)||{cols:6};
  let nodes=D.nodes;
  if(v.nodes)nodes=nodes.filter(n=>v.nodes.includes(n.id));
  if(v.status)nodes=nodes.filter(n=>v.status.includes(n.status));
  const ids=new Set(nodes.map(n=>n.id));
  const edges=D.edges.filter(e=>ids.has(e.from)&&ids.has(e.to));
  return {nodes,edges,view:v};
}

/* barycenter: ordena nós dentro do cluster pela média dos vizinhos
   (varredura frontal + traseira) para reduzir cruzamentos */
function orderBands(bands,edges){
  const idx={}; bands.forEach((b,bi)=>b.ns.forEach((n,i)=>idx[n.id]={b:bi,i}));
  const sweep=(from,to,step)=>{
    for(let bi=from;step>0?bi<=to:bi>=to;bi+=step){
      const scored=bands[bi].ns.map((n,i)=>{
        let s=0,c=0;
        edges.forEach(e=>{
          let o=e.from===n.id?e.to:(e.to===n.id?e.from:null);
          if(!o)return; const p=idx[o]; if(!p)return;
          if(step>0&&p.b>=bi)return; if(step<0&&p.b<=bi)return;
          s+=p.i;c++;
        });
        return {n,k:c?s/c+.001*i:i};
      });
      scored.sort((a,b)=>a.k-b.k);
      bands[bi].ns=scored.map(x=>x.n);
      bands[bi].ns.forEach((n,i)=>idx[n.id]={b:bi,i});
    }
  };
  for(let p=0;p<2;p++){ sweep(1,bands.length-1,1); sweep(bands.length-2,0,-1); }
}

/* path ortogonal com cantos quarter-arc r — sem diagonais (§6.1) */
function ortho(pts,r){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const [x,y]=pts[i],[px,py]=pts[i-1],[nx,ny]=pts[i+1];
    const v1=[Math.sign(x-px),Math.sign(y-py)],v2=[Math.sign(nx-x),Math.sign(ny-y)];
    if(v1[0]===v2[0]&&v1[1]===v2[1]){continue}
    d+=` L${x-v1[0]*r},${y-v1[1]*r} Q${x},${y} ${x+v2[0]*r},${y+v2[1]*r}`;
  }
  const e=pts[pts.length-1];
  d+=` L${e[0]},${e[1]}`;
  return d;
}

function build(){
  const {nodes,edges,view}=visible();
  document.getElementById('title').textContent=D.meta.title;
  document.getElementById('subtitle').textContent=D.meta.subtitle+' · '+D.meta.audit;
  document.getElementById('ver').textContent=D.meta.version;
  document.getElementById('upd').textContent='atualizado '+D.meta.updated;
  document.getElementById('msgtxt').textContent=D.meta.message||'';

  const vb=document.getElementById('viewbar');vb.innerHTML='';
  (D.meta.views||[]).forEach(v=>{
    const b=document.createElement('button');b.type='button';b.className='vbtn'+(v.id===VIEW?' on':'');
    b.setAttribute('role','tab');b.setAttribute('aria-selected',v.id===VIEW?'true':'false');
    b.textContent=v.label;b.title=v.desc;
    b.onclick=()=>{VIEW=v.id;build()};
    vb.appendChild(b);
  });
  const vd=document.createElement('span');vd.className='vdesc';vd.textContent=view.desc||'';
  vb.appendChild(vd);

  /* --- clusters: fileira única --- */
  const bands=GROUPS.map(g=>({g,ns:nodes.filter(n=>n.group===g.id)})).filter(b=>b.ns.length);
  orderBands(bands,edges);
  const bandOf={};bands.forEach((b,bi)=>b.ns.forEach(n=>bandOf[n.id]=bi));

  let maxR=0;
  bands.forEach(b=>{
    b.w=PADX*2+b.ns.length*NW+(b.ns.length-1)*NGAP;
    b.h=LABELH+NH+PADY*2;
    maxR=Math.max(maxR,LANE+6+b.w);
  });
  const W=maxR+LANE+8;
  let y=14;
  bands.forEach(b=>{b.y=y;y+=b.h+BAND_GAP;});
  const H=y-BAND_GAP+16;

  const byId={};
  bands.forEach(b=>{
    b.ns.forEach((n,i)=>{
      n.x=LANE+6+PADX+i*(NW+NGAP);
      n.y=b.y+LABELH+PADY;
      n.cx=n.x+NW/2;n.cy=n.y+NH/2;
      byId[n.id]=n;
    });
  });

  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('role','group');svg.setAttribute('aria-label','Mapa lógico dos achados — vista '+(view.label||''));

  const defs=document.createElementNS(NS,'defs');
  Object.entries(EDGES).forEach(([k,v])=>{
    const m=document.createElementNS(NS,'marker');
    m.setAttribute('id','ar_'+k);m.setAttribute('viewBox','0 0 10 10');
    m.setAttribute('refX',8.5);m.setAttribute('refY',5);
    m.setAttribute('markerWidth',7);m.setAttribute('markerHeight',7);m.setAttribute('orient','auto-start-reverse');
    const p=document.createElementNS(NS,'path');p.setAttribute('d','M0,0 L10,5 L0,10 z');p.setAttribute('fill',v.c);
    m.appendChild(p);defs.appendChild(m);
  });
  svg.appendChild(defs);

  /* containers dos clusters */
  bands.forEach(b=>{
    const bg=document.createElementNS(NS,'rect');
    bg.setAttribute('x',LANE+6);bg.setAttribute('y',b.y);
    bg.setAttribute('width',b.w);bg.setAttribute('height',b.h);
    bg.setAttribute('fill','#0f1730');bg.setAttribute('stroke','#1c2748');bg.setAttribute('rx',12);
    svg.appendChild(bg);
    const t=document.createElementNS(NS,'text');
    t.setAttribute('class','cluster-label');t.setAttribute('x',LANE+6+PADX+4);t.setAttribute('y',b.y+20);
    const short=b.g.label.split('—')[0].trim();
    t.textContent=short;t.setAttribute('textLength',b.w-2*PADX-8);
    const tt=document.createElementNS(NS,'title');tt.textContent=b.g.label;t.appendChild(tt);
    svg.appendChild(t);
  });

  /* --- roteamento (§6): leque, ortogonal, corredores --- */
  const exits={}; // fan: node+side → contador
  const fan=(id,side)=>{const k=id+side;exits[k]=(exits[k]||0)+1;return exits[k]-1;};
  const laneCount={L:0,R:0};

  const edgesG=document.createElementNS(NS,'g');
  edges.forEach(e=>{
    const a=byId[e.from],b=byId[e.to];if(!a||!b)return;
    const spec=EDGES[e.type]||EDGES.supports;
    const bi=bandOf[e.from],bj=bandOf[e.to];
    let pts;
    if(bi===bj){ // intra-cluster: por cima da fileira (não atravessa nós)
      const band=bands[bi];
      if(!band.arcN)band.arcN=0;
      const lift=26+13*(band.arcN++);
      const off=fan(e.from,'T')-0, off2=fan(e.to,'T');
      const yArc=band.y+LABELH-lift;
      const sx=a.cx+((off%3)-1)*14, dx=b.cx+((off2%3)-1)*14;
      pts=[[sx,a.y],[sx,yArc],[dx,yArc],[dx,b.y]];
    }else if(bj===bi+1){ // banda adjacente: corredor central
      const off=fan(e.from,'B'), off2=fan(e.to,'T');
      const midY=(a.y+NH+b.y)/2+(off%2?10:-6);
      const sx=a.cx+((off%5)-2)*14, dx=b.cx+((off2%5)-2)*14;
      if(Math.abs(sx-dx)<2){pts=[[sx,a.y+NH],[sx,b.y]]}
      else pts=[[sx,a.y+NH],[sx,midY],[dx,midY],[dx,b.y]];
    }else{ // skip/backward: corredor lateral (transit nunca atrás de nó)
      const goLeft=(a.cx+b.cx)<W;
      const side=goLeft?'L':'R';
      const li=laneCount[side]++;
      const laneX=goLeft?46+li*15:W-46-li*15;
      const offS=fan(e.from,side), offT=fan(e.to,side);
      const sy=a.cy+((offS%3)-1)*14, ty=b.cy+((offT%3)-1)*14;
      if(goLeft) pts=[[a.x,sy],[laneX,sy],[laneX,ty],[b.x,ty]];
      else pts=[[a.x+NW,sy],[laneX,sy],[laneX,ty],[b.x+NW,ty]];
    }
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',ortho(pts,R));
    p.setAttribute('stroke',spec.c);p.setAttribute('fill','none');
    p.setAttribute('stroke-width',1.8);
    if(e.type==='constrains')p.setAttribute('stroke-dasharray','6 4');
    p.setAttribute('marker-end',`url(#ar_${e.type})`);
    p.setAttribute('data-from',e.from);p.setAttribute('data-to',e.to);
    p.setAttribute('data-type',e.type);
    const tt=document.createElementNS(NS,'title');
    tt.textContent=`${byId[e.from].label}  ${spec.d}  ${byId[e.to].label}`;
    p.appendChild(tt);
    edgesG.appendChild(p);
  });
  svg.appendChild(edgesG);

  /* nós */
  const nodesG=document.createElementNS(NS,'g');
  nodes.forEach(n=>{
    const s=STATUS[n.status]||STATUS.proposed;
    const g=document.createElementNS(NS,'g');
    g.setAttribute('class','node'+(n.focal?' focal':''));
    g.setAttribute('transform',`translate(${n.x},${n.y})`);
    g.setAttribute('data-id',n.id);g.setAttribute('data-status',n.status);
    g.setAttribute('tabindex','0');g.setAttribute('role','button');
    g.setAttribute('aria-label',`${n.label} — ${s.t}${n.focal?' — nó focal':''}`);
    const r=document.createElementNS(NS,'rect');
    r.setAttribute('class','box');r.setAttribute('width',NW);r.setAttribute('height',NH);
    r.setAttribute('rx',10);r.setAttribute('fill',n.focal?'#241a12':'#16203f');
    r.setAttribute('stroke',s.c);
    g.appendChild(r);
    const strip=document.createElementNS(NS,'rect');
    strip.setAttribute('width',5);strip.setAttribute('height',NH);strip.setAttribute('rx',2.5);
    strip.setAttribute('fill',s.c);g.appendChild(strip);
    if(n.focal){
      const ft=document.createElementNS(NS,'text');
      ft.setAttribute('class','focaltag');ft.setAttribute('x',NW-8);ft.setAttribute('y',-8);
      ft.setAttribute('text-anchor','end');
      ft.textContent=n.id==='secretor'?'◆ TESE':'◆ EVIDÊNCIA-CHAVE';
      g.appendChild(ft);
    }
    wrap(n.label,30).forEach((ln,i)=>{
      const t=document.createElementNS(NS,'text');
      t.setAttribute('class','lbl');t.setAttribute('x',14);t.setAttribute('y',24+i*15);
      t.textContent=ln;g.appendChild(t);
    });
    const ic=document.createElementNS(NS,'text');
    ic.setAttribute('class','ico');ic.setAttribute('x',NW-22);ic.setAttribute('y',22);
    ic.setAttribute('fill',s.c);ic.textContent=s.i;g.appendChild(ic);
    if(n.delta==='up'||n.delta==='down'){
      const dd=document.createElementNS(NS,'text');
      dd.setAttribute('x',NW-22);dd.setAttribute('y',38);dd.setAttribute('font-size','11');
      dd.setAttribute('fill',n.delta==='up'?'var(--confirmed)':'var(--refuted)');
      dd.textContent=n.delta==='up'?'▲':'▼';g.appendChild(dd);
    }
    const nt=document.createElementNS(NS,'title');
    nt.textContent=`${n.label}\n${s.t} · ${n.evidence||''}`;
    g.appendChild(nt);
    g.addEventListener('click',()=>select(n,g));
    g.addEventListener('keydown',ev2=>{if(ev2.key==='Enter'||ev2.key===' '){ev2.preventDefault();select(n,g)}});
    g.addEventListener('mouseenter',()=>hi(n.id,true));
    g.addEventListener('mouseleave',()=>hi(null));
    nodesG.appendChild(g);
  });
  svg.appendChild(nodesG);
  const sc=document.getElementById('scroller');sc.innerHTML='';sc.appendChild(svg);

  /* legenda + stats por vista */
  const lg=document.getElementById('legend');lg.innerHTML='';
  Object.entries(STATUS).forEach(([k,v])=>{
    const c=document.createElement('button');c.type='button';c.className='chip on';c.dataset.f=k;
    c.setAttribute('aria-pressed','true');
    c.innerHTML=`<span class="dot" style="background:${v.c}" aria-hidden="true"></span>${v.t.toLowerCase()}`;
    c.title=v.n;c.onclick=()=>toggleFilter(c);
    lg.appendChild(c);
  });
  Object.entries(EDGES).forEach(([k,v])=>{
    const c=document.createElement('span');c.className='chip';c.title='aresta: '+v.d;c.setAttribute('aria-hidden','true');
    c.innerHTML=`<span style="width:16px;height:0;border-top:2px ${k==='constrains'?'dashed':'solid'} ${v.c};display:inline-block"></span>${v.d}`;
    lg.appendChild(c);
  });
  const st=document.createElement('div');st.className='stats';
  const cnt=k=>nodes.filter(n=>n.status===k).length;
  st.innerHTML=`<span><b>${cnt('confirmed')}</b> ✓</span><span><b>${cnt('constraint')}</b> ⚠</span><span><b>${cnt('refuted')}</b> ✕</span><span><b>${cnt('proposed')+cnt('active')}</b> ⏳/▶</span><span>vista <b>${nodes.length}</b> nós · <b>${edges.length}</b> conexões</span>`;
  lg.appendChild(st);

  const gt=document.getElementById('gates');gt.innerHTML='';
  const tones={ready:'var(--confirmed)',wait:'var(--constraint)'};
  D.gates.forEach(g=>{
    const el=document.createElement('div');el.className='gate';
    el.innerHTML=`<b>${g.id} · ${g.name}</b><span class="st" style="color:${tones[g.tone]||'var(--mut)'}">${g.status}</span><div class="dt">${g.detail}</div>`;
    gt.appendChild(el);
  });

  const pb=document.getElementById('probs');pb.innerHTML='';
  D.probability_history.forEach(p=>{
    const row=document.createElement('div');row.className='probrow';
    const pts=p.points,last=pts[pts.length-1],prev=pts[pts.length-2];
    let dir='—',dc='var(--mut)';
    if(prev){if(last.low+last.high>prev.low+prev.high){dir='↗';dc='var(--confirmed)'}else if(last.low+last.high<prev.low+prev.high){dir='↘';dc='var(--refuted)'}else dir='≈'}
    row.innerHTML=`<div class="name">${p.component}</div><div class="probbar" role="img" aria-label="${p.component}: ${last.low} a ${last.high} por cento (${last.note})"></div><div class="dir" style="color:${dc}" aria-hidden="true">${dir}</div>`;
    const bar=row.querySelector('.probbar');
    pts.forEach((pt,i)=>{
      const seg=document.createElement('div');seg.className='seg';
      seg.style.left=(pt.low*0.8)+'%';seg.style.width=((pt.high-pt.low)*0.8+1)+'%';
      seg.style.background=i===pts.length-1?'#2f6f4f':'#33406b';
      seg.title=pt.date+': '+pt.low+'–'+pt.high+'% — '+pt.note;
      bar.appendChild(seg);
    });
    const cap=document.createElement('div');cap.className='cap';cap.style.left=(last.high*0.8)+'%';
    cap.title=last.date+': '+last.low+'–'+last.high+'% — '+last.note;bar.appendChild(cap);
    pb.appendChild(row);
  });

  const vt=document.getElementById('valtbl');
  vt.innerHTML='<tr><th>Achado</th><th>Bloco</th><th>Evidência</th><th>Status</th><th>Atualizado</th></tr>';
  nodes.filter(n=>n.status==='confirmed'||n.status==='constraint').forEach(n=>{
    const s=STATUS[n.status];
    const tr=document.createElement('tr');tr.className='rowbtn';tr.tabIndex=0;
    tr.innerHTML=`<td>${n.label}</td><td style="color:var(--mut)">${GROUPS.find(g=>g.id===n.group)?.label.split('—')[0]||''}</td><td>${n.evidence||''}</td><td><span class="badge" style="border:1px solid ${s.c};color:${s.c}">${s.i} ${s.t}</span></td><td style="color:var(--mut)">${n.updated}</td>`;
    const op=()=>select(n,tr);
    tr.onclick=op;
    tr.addEventListener('keydown',e=>{if(e.key==='Enter')op()});
    vt.appendChild(tr);
  });

  const cg=document.getElementById('changelog');cg.innerHTML='';
  [...D.changelog].reverse().forEach(c=>{
    const el=document.createElement('div');el.className='chg';
    el.innerHTML=`<span class="d">${c.date}</span><span class="v">${c.version}</span><p>${c.text}</p>`;
    cg.appendChild(el);
  });
  curFilter=new Set(Object.keys(STATUS));
}

/* ---- drawer ---- */
const panel=document.getElementById('panel');
const veil=document.getElementById('veil');
const closeBtn=document.getElementById('closeBtn');
let lastFocus=null;

function select(n,srcEl){
  const s=STATUS[n.status];
  const g=GROUPS.find(x=>x.id===n.group);
  lastFocus=srcEl||document.activeElement;
  document.getElementById('ptitle').textContent=n.label;
  document.getElementById('pbody').innerHTML=`
   <div><span class="badge" style="border:1px solid ${s.c};color:${s.c}">${s.i} ${s.t}</span>
   <span class="badge" style="border:1px solid var(--line);color:var(--mut)">${g?g.label.split('—')[0]:n.group}</span>
   ${n.focal?`<span class="badge" style="border:1px solid var(--focal);color:var(--focal)">◆ nó focal</span>`:''}
   ${n.delta?`<span class="badge" style="border:1px solid ${n.delta==='up'?'var(--confirmed)':'var(--refuted)'};color:${n.delta==='up'?'var(--confirmed)':'var(--refuted)'}">${n.delta==='up'?'▲ subiu nesta versão':'▼ caiu/foi corrigido'}</span>`:''}</div>
   <div class="kv"><b>Evidência:</b> ${n.evidence||'—'}</div>
   ${n.prob?`<div class="kv"><b>Probabilidade:</b> ${n.prob}</div>`:''}
   <div class="kv"><b>Última atualização:</b> ${n.updated}</div>
   <div class="detail">${n.detail||''}</div>
   ${(n.refs&&n.refs.length)?`<div class="refs"><b>Refs:</b> ${n.refs.join(' · ')}</div>`:''}`;
  panel.classList.add('open');veil.classList.add('on');
  panel.setAttribute('aria-hidden','false');veil.setAttribute('aria-hidden','false');
  hi(n.id,true);
  closeBtn.focus();
}
function closePanel(){
  panel.classList.remove('open');veil.classList.remove('on');
  panel.setAttribute('aria-hidden','true');veil.setAttribute('aria-hidden','true');
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
  hi(null);
}
closeBtn.addEventListener('click',closePanel);
veil.addEventListener('click',closePanel);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&panel.classList.contains('open'))closePanel();
  if(e.key==='Tab'&&panel.classList.contains('open')){
    const f=panel.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])');
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});

let curFilter=new Set(Object.keys(STATUS));
function toggleFilter(chip){
  const k=chip.dataset.f;
  if(curFilter.has(k)&&curFilter.size===1)return;
  if(curFilter.has(k)){curFilter.delete(k);chip.classList.remove('on');chip.setAttribute('aria-pressed','false')}
  else{curFilter.add(k);chip.classList.add('on');chip.setAttribute('aria-pressed','true')}
  document.querySelectorAll('.node').forEach(el=>{
    el.classList.toggle('dimmed',!curFilter.has(el.dataset.status));
  });
}
let selId=null;
function hi(id,hover){
  const active=hover?id:selId;
  document.querySelectorAll('svg path[data-type]').forEach(p=>p.style.opacity='');
  document.querySelectorAll('.node').forEach(el=>el.classList.remove('dimmed'));
  if(curFilter.size<Object.keys(STATUS).length){
    document.querySelectorAll('.node').forEach(el=>{
      if(!curFilter.has(el.dataset.status))el.classList.add('dimmed');
    });
  }
  if(!active)return;
  document.querySelectorAll('.node').forEach(el=>{
    if(el.dataset.id!==active)el.classList.add('dimmed');
  });
  document.querySelectorAll('svg path[data-type]').forEach(p=>{
    if(p.dataset.from!==active&&p.dataset.to!==active)p.style.opacity=.08;
  });
  if(!hover)selId=active;else selId=null;
}

fetch('data.json').then(r=>r.json()).then(d=>{D=d;build()}).catch(e=>{
  const el=document.getElementById('err');
  el.style.display='block';
  el.textContent='Não consegui carregar data.json ('+e+'). Sirva esta pasta via HTTP (ex.: python3 -m http.server 8137) — fetch não funciona sobre file://.';
});
</script>
