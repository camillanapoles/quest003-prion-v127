name: Unified Thesis Build (PaperSpine braço-B)

on:
  push:
    branches: [writing-v2-test]
    paths: ["paper_rewriting_output/final_paper/**", "experiments/m31/**", "experiments/xspecies/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deps (pandoc + xetex + matplotlib — à prova de espelho travado)
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
          timeout 420 sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=25 install -y -qq \
            pandoc texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-xetex \
            || (sudo apt-get -o Acquire::Retries=5 update -qq && timeout 420 sudo apt-get install -y -qq \
            pandoc texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-xetex)
          pip install -q numpy matplotlib

      - name: Figuras auditáveis (Fig.4 + Fig.5 — leem SÓ JSONs do registro)
        run: |
          python3 experiments/xspecies/make_fig4_thetaspecies.py
          python3 experiments/m31/make_fig5_doseladder.py
          test -f paper/latex/figs/fig4_theta_species.png
          test -f paper/latex/figs/fig5_dose_ladder.png

      - name: "main.tex EDIÇÃO A+ (builder determinístico — md-mestre → pandoc → citações/audit-macro)"
        run: python3 scripts/build_aplus_tex.py

      - name: PDF (xelatex ×2, cwd=final_paper para os caminhos ../.. das figuras)
        run: |
          cd paper_rewriting_output/final_paper
          xelatex -interaction=nonstopmode main.tex || true
          xelatex -interaction=nonstopmode main.tex || true
          test -f main.pdf && echo "PDF ok ($(pdfinfo main.pdf 2>/dev/null | grep Pages || echo páginas-geradas))" 
          cp main.pdf paper.pdf

      - name: Word (com figuras embutidas + política tipográfica)
        run: |
          pandoc paper_rewriting_output/final_paper/tese_unificada.md -o paper_rewriting_output/final_paper/paper.docx
          python3 scripts/fix_docx_fonts.py paper_rewriting_output/final_paper/paper.docx

      - name: Sanidade dos artefatos
        run: |
          test -f paper_rewriting_output/final_paper/main.pdf
          test -f paper_rewriting_output/final_paper/paper.docx
          ls -la paper_rewriting_output/final_paper/

      - name: Commit artefatos versionados
        run: |
          git config user.name "ci-build"
          git config user.email "ci@quest003.local"
          STAMP=$(date +%Y%m%d-%H%M%S)
          mkdir -p paper/pdf
          cp paper_rewriting_output/final_paper/paper.pdf "paper/pdf/tese_unificada_${STAMP}.pdf"
          git add paper_rewriting_output/final_paper/main.tex paper_rewriting_output/final_paper/paper.pdf \
            paper_rewriting_output/final_paper/paper.docx paper/latex/figs/fig4_theta_species.png \
            paper/latex/figs/fig5_dose_ladder.png "paper/pdf/tese_unificada_${STAMP}.pdf" || true
          git commit -m "ci: tese unificada build ${STAMP} (figs auditáveis + main.tex + PDF + docx — braço-B)" || echo "nada"
          git pull --rebase --autostash -q origin main || true
          git push || (git pull --rebase -q origin main && git push)
